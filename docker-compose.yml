services:
  workbench:
    build:
      context: .
      args:
        DSH_VERSION: "0.2.2-rc.5"
    image: ownspire/workbench:0.2.2-rc.5
    container_name: workbench
    ports:
      # 默认放开到局域网;流量先过容器内鉴权壳(登录页 + Cookie),dsh 本身只听 127.0.0.1:3081
      # 只给本机用可把 BIND_IP 改成 127.0.0.1
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-3080}:3080"
    env_file:
      # 可选:不建 .env 也能启动;此时 DATA_DIR 走 ./data,登录密码自动生成并写入挂载目录
      - path: .env
        required: false
    environment:
      # HOME 只决定 UI 目录选择器起点/agent shell 的 ~;dsh 配置走 DSH_HOME,鉴权凭据仍写 /data/dsh
      HOME: /data/workspace
      DSH_HOME: /data/dsh/.dsh
      # 未设置时由 entrypoint 自动生成并持久化
      AUTH_USER: ${AUTH_USER:-workbench}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # dsh 对外链接与信任的 Host(按需在 .env 中改成局域网 IP/域名)
      DSH_PUBLIC_URL: ${DSH_PUBLIC_URL:-}
      DSH_TRUSTED_HOST: ${DSH_TRUSTED_HOST:-}
    volumes:
      # DATA_DIR 在 .env 中配置(相对路径以本文件所在目录为基准)
      - ${DATA_DIR:-./data}/dsh:/data/dsh
      - ${DATA_DIR:-./data}/workspace:/data/workspace
    restart: unless-stopped
